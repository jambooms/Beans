<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Recipe Compendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f5ede0;
    --paper-warm: #fbf5ec;
    --ink: #2d1f14;
    --ink-soft: #5c4633;
    --muted: #8b7355;
    --accent: #a0522d;
    --accent-dark: #6b2e1a;
    --rule: #c9a96e;
    --rule-soft: #e4d4b1;
    --shadow: 0 1px 2px rgba(45, 31, 20, 0.06), 0 4px 12px rgba(45, 31, 20, 0.04);
    --shadow-lift: 0 4px 8px rgba(45, 31, 20, 0.08), 0 16px 32px rgba(45, 31, 20, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    min-height: 100vh;
    /* Subtle paper grain */
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201, 169, 110, 0.04) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(160, 82, 45, 0.03) 0, transparent 50%);
  }

  .app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    text-align: center;
    padding: 24px 0 48px;
    border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 48px;
    position: relative;
  }
  .masthead .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .masthead h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(56px, 9vw, 108px);
    font-weight: 400;
    font-style: italic;
    line-height: 0.95;
    color: var(--accent-dark);
    letter-spacing: -0.02em;
  }
  .masthead .subtitle {
    font-size: 18px;
    font-style: italic;
    color: var(--muted);
    margin-top: 16px;
    letter-spacing: 0.02em;
  }
  .masthead .ornament {
    color: var(--rule);
    font-size: 20px;
    margin: 16px 0;
    letter-spacing: 0.5em;
  }

  /* ---------- Controls bar ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }
  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .search {
    flex: 1;
    position: relative;
  }
  .search input {
    width: 100%;
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 2px;
    padding: 14px 16px 14px 44px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.1);
  }
  .search input::placeholder { color: var(--muted); font-style: italic; }
  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  .tag-rail {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .tag-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 8px;
  }
  .tag {
    background: transparent;
    border: 1px solid var(--rule-soft);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.01em;
  }
  .tag:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tag.active {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
    color: var(--paper-warm);
  }
  .tag .count {
    opacity: 0.6;
    font-size: 12px;
    margin-left: 4px;
  }
  .clear-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    text-decoration: underline;
    text-decoration-color: var(--rule-soft);
    text-underline-offset: 3px;
  }
  .clear-btn:hover { color: var(--accent); }

  /* ---------- Recipe grid ---------- */
  .count-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px;
  }
  .card {
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
    padding: 32px 28px 28px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--rule));
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
    border-color: var(--rule);
  }
  .card:hover::before { opacity: 1; }
  .card .number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .card h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--accent-dark);
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .card .card-subtitle {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    margin-bottom: 20px;
  }
  .card .card-meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
    padding-top: 16px;
    border-top: 1px solid var(--rule-soft);
    margin-bottom: 16px;
  }
  .card .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card-tag {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: var(--accent);
    background: rgba(160, 82, 45, 0.08);
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .card-tag.heritage {
    background: rgba(201, 169, 110, 0.22);
    color: var(--accent-dark);
    font-style: italic;
  }
  .card-tag.heritage::before { content: "✦ "; font-style: normal; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-style: italic;
    font-size: 18px;
  }

  /* ---------- Modal (recipe detail) ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(45, 31, 20, 0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    animation: fadeIn 0.22s ease;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--paper);
    max-width: 820px;
    width: 100%;
    border-radius: 3px;
    box-shadow: 0 30px 80px rgba(45, 31, 20, 0.3);
    padding: 56px 64px 64px;
    position: relative;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.18s;
  }
  .close-btn:hover { background: var(--rule-soft); color: var(--accent-dark); }

  .recipe-header { text-align: center; margin-bottom: 40px; }
  .recipe-header .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .recipe-header h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(40px, 6vw, 56px);
    font-weight: 400;
    color: var(--accent-dark);
    line-height: 1.05;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .recipe-header .italic-sub {
    font-style: italic;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .recipe-header .ornament { color: var(--rule); letter-spacing: 0.4em; margin: 8px 0; }
  .recipe-header .description {
    font-style: italic;
    color: var(--ink-soft);
    max-width: 560px;
    margin: 24px auto 0;
    font-size: 17px;
  }

  .recipe-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 20px;
  }

  /* Serving scaler */
  .scaler {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 32px 0;
    padding: 24px;
    background: var(--paper-warm);
    border-top: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
  }
  .scaler .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .scaler-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .scaler button {
    width: 36px;
    height: 36px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--accent-dark);
    font-size: 20px;
    font-family: 'Cormorant Garamond', serif;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .scaler button:hover:not(:disabled) {
    background: var(--accent-dark);
    color: var(--paper-warm);
    border-color: var(--accent-dark);
  }
  .scaler button:disabled { opacity: 0.3; cursor: not-allowed; }
  .servings-value {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    color: var(--accent-dark);
    min-width: 70px;
    text-align: center;
    line-height: 1;
  }
  .servings-value .people {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    display: block;
    margin-top: 4px;
  }

  .section-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 36px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .ingredient-list { list-style: none; }
  .ingredient-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    gap: 12px;
    border-bottom: 1px dotted var(--rule-soft);
  }
  .ingredient-list li:last-child { border-bottom: none; }
  .ingredient-list .i-name { font-size: 17px; color: var(--ink); }
  .ingredient-list .i-amount {
    font-style: italic;
    color: var(--accent-dark);
    font-weight: 500;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    counter-increment: step;
    position: relative;
    padding: 16px 0 16px 52px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .steps-list li:last-child { border-bottom: none; }
  .steps-list li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 16px;
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    color: var(--accent);
    font-style: italic;
    line-height: 1;
  }
  .step-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .step-content { font-size: 17px; line-height: 1.6; }
  .step-content .inline-amount {
    font-style: italic;
    color: var(--accent-dark);
    font-weight: 500;
    background: rgba(201, 169, 110, 0.15);
    padding: 0 4px;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }

  .notes {
    margin-top: 36px;
    padding: 24px 28px;
    background: var(--paper-warm);
    border-left: 3px solid var(--rule);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.65;
  }
  .notes-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    font-style: normal;
    margin-bottom: 10px;
    display: block;
  }

  /* ---------- Nutrition panel ---------- */
  .nutrition {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: var(--rule-soft);
    border-radius: 3px;
    overflow: hidden;
    margin: 24px 0 8px;
  }
  .nutrition .nut-cell {
    background: var(--paper-warm);
    padding: 14px 8px;
    text-align: center;
  }
  .nutrition .nut-value {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--accent-dark);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .nutrition .nut-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .nutrition-footnote {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    text-align: center;
    margin-bottom: 16px;
  }

  /* Nutrition strip on cards */
  .card-nutrition {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--rule-soft);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
  }
  .card-nutrition span strong {
    color: var(--accent-dark);
    font-weight: 500;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
  }

  /* ---------- Ingredient search ---------- */
  .search-row { flex-wrap: wrap; }
  .search-mode {
    display: flex;
    gap: 4px;
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 999px;
    padding: 3px;
  }
  .search-mode button {
    background: transparent;
    border: none;
    padding: 8px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.18s;
  }
  .search-mode button.active {
    background: var(--accent-dark);
    color: var(--paper-warm);
  }

  .matched-ingredient {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent-dark);
    background: rgba(201, 169, 110, 0.25);
    padding: 2px 8px;
    border-radius: 2px;
    margin-top: 12px;
    letter-spacing: 0.02em;
  }

  /* ---------- Recipe action buttons ---------- */
  .recipe-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 24px 0 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    color: var(--accent-dark);
    padding: 10px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.18s;
  }
  .action-btn:hover {
    background: var(--accent-dark);
    color: var(--paper-warm);
    border-color: var(--accent-dark);
  }
  .action-btn.added {
    background: var(--accent);
    color: var(--paper-warm);
    border-color: var(--accent);
  }

  /* ---------- Shopping cart FAB ---------- */
  .cart-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-dark);
    color: var(--paper-warm);
    border: none;
    box-shadow: 0 8px 24px rgba(45, 31, 20, 0.3);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: transform 0.2s;
  }
  .cart-fab.visible { display: flex; }
  .cart-fab:hover { transform: scale(1.08); }
  .cart-fab .count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--rule);
    color: var(--ink);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
  }

  /* ---------- Shopping list modal ---------- */
  .shopping-list h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 36px;
    color: var(--accent-dark);
    margin-bottom: 8px;
  }
  .shopping-list .from-recipes {
    font-style: italic;
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 24px;
  }
  .shopping-category {
    margin-bottom: 24px;
  }
  .shopping-category h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .shopping-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 8px 0;
    gap: 12px;
  }
  .shopping-item label {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex: 1;
    cursor: pointer;
  }
  .shopping-item input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    top: 2px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .shopping-item input[type="checkbox"]:checked {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
  }
  .shopping-item input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    color: var(--paper-warm);
    font-size: 13px;
    top: -2px;
    left: 3px;
  }
  .shopping-item input[type="checkbox"]:checked + .s-name {
    text-decoration: line-through;
    color: var(--muted);
  }
  .shopping-item .s-name { font-size: 16px; flex: 1; }
  .shopping-item .s-amount {
    font-style: italic;
    color: var(--accent-dark);
    font-size: 15px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .shopping-item input[type="checkbox"]:checked ~ .s-amount {
    color: var(--muted);
    text-decoration: line-through;
  }
  .shopping-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule-soft);
  }

  /* Mobile */
  @media (max-width: 680px) {
    .app { padding: 32px 20px 64px; }
    .modal { padding: 40px 24px 32px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="masthead">
    <div class="eyebrow">Est. 2026</div>
    <h1>Compendium</h1>
    <div class="ornament">· ✦ ·</div>
    <div class="subtitle">A collection of dishes, in grams and millilitres, scalable to any table.</div>
  </header>

  <section class="controls">
    <div class="search-row">
      <div class="search">

  { p: /mint|coriander|basil|oregano/i, d: { kcal:40,  fat:0.7, carbs:7, sugar:0, protein:3.3 } },
  { p: /chilli|chili powder|paprika|cumin|red pepper flake/i, d: { kcal:282, fat:14, carbs:50, sugar:7.2, protein:12 } },
  { p: /cinnamon|garlic powder/i,    d: { kcal:247, fat:1.2, carbs:81, sugar:2.2, protein:4 } },
  { p: /(black )?pepper|salt/i,      d: { kcal:0,   fat:0,   carbs:0, sugar:0,   protein:0 } },
  { p: /\blime\b|\blemons?\b/i,      d: { kcal:30,  fat:0.2, carbs:11, sugar:1.7, protein:0.7 } },
  { p: /warm water|\bwater\b/i,      d: { kcal:0,   fat:0,   carbs:0, sugar:0, protein:0 } },
];

// Approximate weight of "1 unit" when ingredient is countable (no g/ml unit).
// Used for nutrition calc on ingredients like "1 onion" or "3 garlic cloves".
const UNIT_WEIGHTS = {
  "large onion":        150,
  "small shallot":       30,
  "garlic clove":         5,
  "lemongrass stalk":    15,
  "lime":                65,
  "lemon":               60,
  "avocado":            170,
  "chili":                5,
  "corn tortilla":       25,
  "flour tortilla":      40,
  "bell pepper":        150,
  "default":             50, // fallback
};

function unitWeightFor(name) {
  const n = name.toLowerCase();
  for (const key of Object.keys(UNIT_WEIGHTS)) {
    if (key !== "default" && n.includes(key)) return UNIT_WEIGHTS[key];
  }
  if (n.includes("onion"))    return 150;
  if (n.includes("shallot"))  return 30;
  if (n.includes("clove"))    return 5;
  if (n.includes("tortilla")) return 25;
  if (n.includes("stalk"))    return 15;
  if (n.includes("pepper"))   return 150;
  return UNIT_WEIGHTS.default;
}

function nutritionFor(ingredient) {
  // Skip "to taste" or very small amounts
  const name = ingredient.name;
  const hit = NUTRITION_DB.find(entry => entry.p.test(name));
  if (!hit) return { kcal:0, fat:0, carbs:0, sugar:0, protein:0 };

  // Determine grams
  let grams;
  if (ingredient.unit === "g" || ingredient.unit === "ml") {
    grams = ingredient.amount;
  } else if (ingredient.unit === "cloves" || ingredient.unit === "stalks") {
    grams = ingredient.amount * unitWeightFor(name);
  } else {
    // countable
    grams = ingredient.amount * unitWeightFor(name);
  }

  // Realism adjustments — how much is actually EATEN, not used.
  // Frying oil: only ~10-15% is actually absorbed by food. Most stays in pan.
  let factor = 1;
  const n = name.toLowerCase();
  if (/for frying|frying tortillas/.test(n)) {
    factor = 0.12;
  }
  // Alcohol: cooks off almost entirely in chorizo-style cooks
  else if (/rum|gin|vodka|alcohol/.test(n)) {
    factor = 0.15;
  }
  // Ground pork in chorizo renders out roughly 25% of its fat to the pan
  else if (/ground pork|pork\b/.test(n)) {
    // Keep kcal/protein/carbs intact but reduce fat by 30%
    const f = grams / 100;
    return {
      kcal:    hit.d.kcal    * f * 0.85, // some kcal loss from rendered fat
      fat:     hit.d.fat     * f * 0.70,
      carbs:   hit.d.carbs   * f,
      sugar:   hit.d.sugar   * f,
      protein: hit.d.protein * f,
    };
  }

  const f = (grams / 100) * factor;
  return {
    kcal:    hit.d.kcal    * f,
    fat:     hit.d.fat     * f,
    carbs:   hit.d.carbs   * f,
    sugar:   hit.d.sugar   * f,
    protein: hit.d.protein * f,
  };
}

function recipeNutritionPerServing(recipe) {
  const totals = { kcal:0, fat:0, carbs:0, sugar:0, protein:0 };
  recipe.sections.forEach(sec => {
    sec.ingredients.forEach(ing => {
      const n = nutritionFor(ing);
      totals.kcal    += n.kcal;
      totals.fat     += n.fat;
      totals.carbs   += n.carbs;
      totals.sugar   += n.sugar;
      totals.protein += n.protein;
    });
  });
  const servings = recipe.baseServings;
  return {
    kcal:    Math.round(totals.kcal    / servings),
    fat:     Math.round(totals.fat     / servings),
    carbs:   Math.round(totals.carbs   / servings),
    sugar:   Math.round(totals.sugar   / servings),
    protein: Math.round(totals.protein / servings),
  };
}

/* ============================================================
 *  SHOPPING LIST — categorization
 * ============================================================ */
const SHOPPING_CATEGORIES = [
  { name: "Produce",     p: /onion|shallot|garlic|lemongrass|lime|lemon|cucumber|carrot|lettuce|beansprout|mint|coriander|basil|tomato|bell pepper|avocado|chilli|chili powder$|ginger/i },
  { name: "Proteins",    p: /chicken|pork|tofu|beef|fish|shrimp|prawn|egg/i },
  { name: "Dairy & Deli",p: /sour cream|cheese|queso|yogurt|milk|butter|cream/i },
  { name: "Pantry",      p: /vermicelli|noodle|tortilla|rice|pasta|flour|cornstarch|sugar|syrup|peanut|oregano|cumin|paprika|cinnamon|coriander|pepper|salt|red pepper flake|garlic powder|stock/i },
  { name: "Condiments",  p: /soy sauce|fish sauce|vinegar|oil|hot sauce|pickled|fried shallot/i },
  { name: "Alcohol",     p: /rum|gin|vodka|wine|beer|alcohol/i },
];
const CATEGORY_OTHER = "Other";

function categoryFor(name) {
  for (const c of SHOPPING_CATEGORIES) {
    if (c.p.test(name)) return c.name;
  }
  return CATEGORY_OTHER;
}

/* ============================================================
 *  STATE
 * ============================================================ */
const state = {
  activeTags: new Set(),
  search: "",
  searchMode: "recipe", // "recipe" or "ingredient"
  openRecipe: null,
  servings: {}, // { recipeId: number }
  cart: new Set(), // set of recipe ids in shopping list
  shopOpen: false,
};

/* ============================================================
 *  INGREDIENT SCALING
 * ============================================================ */
function formatAmount(amount, unit) {
  // Round intelligently based on magnitude and unit
  let display;
  if (!unit || unit === "cloves" || unit === "stalks") {
    // Whole countable items — round to 0.5 or whole
    const rounded = Math.round(amount * 2) / 2;
    display = rounded % 1 === 0 ? rounded.toString() : rounded.toFixed(1);
    // Singular/plural for count units
    if (unit && Number(display) === 1) {
      unit = unit === "cloves" ? "clove" : unit === "stalks" ? "stalk" : unit;
    }
  } else if (unit === "g" || unit === "ml") {
    // Weights and volumes — round based on size
    if (amount < 10) display = amount.toFixed(1).replace(/\.0$/, "");
    else if (amount < 100) display = Math.round(amount).toString();
    else display = (Math.round(amount / 5) * 5).toString();
  } else {
    display = Math.round(amount).toString();
  }
  return unit ? `${display} ${unit}` : display;
}

function scaleIngredient(ing, servings, base) {
  const factor = servings / base;
  const scaled = ing.amount * factor;
  return formatAmount(scaled, ing.unit);
}

/* ============================================================
 *  RENDERING — tag rail
 * ============================================================ */
function recipeCountForTag(tag) {
  return RECIPES.filter(r => r.tags.includes(tag)).length;
}

function renderTagRail() {
  const rail = document.getElementById("tag-rail");
  // Keep the label, replace tags
  rail.innerHTML = '<span class="tag-label">Filter</span>';
  ALL_TAGS.forEach(tag => {
    const count = recipeCountForTag(tag);
    if (count === 0) return; // hide tags with no recipes yet
    const btn = document.createElement("button");
    btn.className = "tag" + (state.activeTags.has(tag) ? " active" : "");
    btn.innerHTML = `${tag}<span class="count">·${count}</span>`;
    btn.onclick = () => {
      if (state.activeTags.has(tag)) state.activeTags.delete(tag);
      else state.activeTags.add(tag);
      render();
    };
    rail.appendChild(btn);
  });
  if (state.activeTags.size > 0 || state.search) {
    const clear = document.createElement("button");
    clear.className = "clear-btn";
    clear.textContent = "clear all";
    clear.onclick = () => {
      state.activeTags.clear();
      state.search = "";
      document.getElementById("search").value = "";
      render();
    };
    rail.appendChild(clear);
  }
}

/* ============================================================
 *  RENDERING — recipe grid
 * ============================================================ */
function matchesFilters(recipe) {
  if (state.activeTags.size > 0) {
    for (const t of state.activeTags) if (!recipe.tags.includes(t)) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    if (state.searchMode === "ingredient") {
      // Match against ingredient names
      let hit = null;
      for (const sec of recipe.sections) {
        for (const ing of sec.ingredients) {
          if (ing.name.toLowerCase().includes(q)) { hit = ing.name; break; }
        }
        if (hit) break;
      }
      if (!hit) return false;
      recipe._matchedIngredient = hit; // stash for rendering
    } else {
      const hay = (recipe.title + " " + recipe.subtitle + " " + recipe.description + " " + recipe.tags.join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
      recipe._matchedIngredient = null;
    }
  } else {
    recipe._matchedIngredient = null;
  }
  return true;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const countLabel = document.getElementById("count-label");
  const filtered = RECIPES.filter(matchesFilters);
  countLabel.textContent = filtered.length === RECIPES.length
    ? `${RECIPES.length} recipe${RECIPES.length === 1 ? "" : "s"}`
    : `${filtered.length} of ${RECIPES.length} recipes`;

  grid.innerHTML = "";
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No recipes match these filters.</div>';
    return;
  }
  filtered.forEach(r => {
    const card = document.createElement("article");
    card.className = "card";
    card.onclick = () => openRecipe(r.id);
    const nut = recipeNutritionPerServing(r);
    card.innerHTML = `
      <div class="number">Recipe · ${r.number}</div>
      <h3>${r.title}</h3>
      <div class="card-subtitle">${r.subtitle}</div>
      <div class="card-meta">
        <span>◷ ${r.meta.prep}</span>
        <span>♨ ${r.meta.cook}</span>
        <span>☺ ${r.baseServings}</span>
      </div>
      <div class="card-tags">${r.tags.map(t => `<span class="card-tag${t === 'heritage' ? ' heritage' : ''}">${t}</span>`).join("")}</div>
      <div class="card-nutrition">
        <span><strong>${nut.kcal}</strong> kcal</span>
        <span><strong>${nut.protein}</strong>g protein</span>
        <span><strong>${nut.carbs}</strong>g carbs</span>
        <span><strong>${nut.fat}</strong>g fat</span>
      </div>
      ${r._matchedIngredient ? `<div class="matched-ingredient">✓ ${r._matchedIngredient}</div>` : ""}
    `;
    grid.appendChild(card);
  });
}

/* ============================================================
 *  RENDERING — recipe modal
 * ============================================================ */
function openRecipe(id) {
  state.openRecipe = id;
  if (!state.servings[id]) state.servings[id] = RECIPES.find(r => r.id === id).baseServings;
  renderModal();
  document.getElementById("modal-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeRecipe() {
  state.openRecipe = null;
  document.getElementById("modal-backdrop").classList.remove("open");
  document.body.style.overflow = "";
}

function buildIngredientMap(recipe) {
  const map = {};
  recipe.sections.forEach(sec => sec.ingredients.forEach(ing => { map[ing.id] = ing; }));
  return map;
}

function renderStepBody(body, ingredientMap, servings, baseServings) {
  return body.replace(/\{([a-z0-9]+)\}/gi, (_, id) => {
    const ing = ingredientMap[id];
    if (!ing) return `{${id}}`;
    const amount = scaleIngredient(ing, servings, baseServings);
    return `<span class="inline-amount">${amount} ${ing.name}</span>`;
  });
}

function renderModal() {
  const r = RECIPES.find(x => x.id === state.openRecipe);
  if (!r) return;
  const servings = state.servings[r.id];
  const ingMap = buildIngredientMap(r);
  const nut = recipeNutritionPerServing(r);
  const inCart = state.cart.has(r.id);

  const sectionsHtml = r.sections.map(sec => `
    <div class="section-heading">${sec.name}</div>
    <ul class="ingredient-list">
      ${sec.ingredients.map(ing => `
        <li>
          <span class="i-name">${ing.name}${ing.note ? ` <em style="color:var(--muted); font-size:0.9em;">(${ing.note})</em>` : ""}</span>
          <span class="i-amount">${scaleIngredient(ing, servings, r.baseServings)}</span>
        </li>
      `).join("")}
    </ul>
  `).join("");

  const stepsHtml = r.steps.map(step => `
    <li>
      <div class="step-title">${step.title}</div>
      <div class="step-content">${renderStepBody(step.body, ingMap, servings, r.baseServings)}</div>
    </li>
  `).join("");

  document.getElementById("modal-content").innerHTML = `
    <div class="recipe-header">
      <div class="label">Recipe · ${r.number}</div>
      <h2>${r.title}</h2>
      <div class="italic-sub">${r.subtitle}</div>
      <div class="ornament">· ✦ ·</div>
      <div class="description">${r.description}</div>
      <div class="recipe-tags">${r.tags.map(t => `<span class="card-tag${t === 'heritage' ? ' heritage' : ''}">${t}</span>`).join("")}</div>
    </div>

    <div class="scaler">
      <div class="label">Servings</div>
      <div class="scaler-controls">
        <button id="dec" ${servings <= 1 ? "disabled" : ""} aria-label="Decrease servings">−</button>
        <div class="servings-value">${servings}<span class="people">${servings === 1 ? "person" : "people"}</span></div>
        <button id="inc" ${servings >= 20 ? "disabled" : ""} aria-label="Increase servings">+</button>
      </div>
    </div>

    <div class="nutrition">
      <div class="nut-cell"><div class="nut-value">${nut.kcal}</div><div class="nut-label">Kcal</div></div>
      <div class="nut-cell"><div class="nut-value">${nut.protein}g</div><div class="nut-label">Protein</div></div>
      <div class="nut-cell"><div class="nut-value">${nut.carbs}g</div><div class="nut-label">Carbs</div></div>
      <div class="nut-cell"><div class="nut-value">${nut.sugar}g</div><div class="nut-label">Sugar</div></div>
      <div class="nut-cell"><div class="nut-value">${nut.fat}g</div><div class="nut-label">Fat</div></div>
    </div>
    <div class="nutrition-footnote">Estimated per serving · not medical advice</div>

    <div class="recipe-actions">
      <button class="action-btn ${inCart ? "added" : ""}" id="cart-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        ${inCart ? "Added to shopping list" : "Add to shopping list"}
      </button>
      <button class="action-btn" id="shop-now">
        View shopping list
      </button>
    </div>

    ${sectionsHtml}

    <div class="section-heading">Method</div>
    <ol class="steps-list">${stepsHtml}</ol>

    ${r.notes ? `
      <div class="notes">
        <span class="notes-label">Cook's Notes</span>
        ${r.notes}
      </div>` : ""}
  `;

  document.getElementById("dec").onclick = () => {
    if (state.servings[r.id] > 1) { state.servings[r.id]--; renderModal(); }
  };
  document.getElementById("inc").onclick = () => {
    if (state.servings[r.id] < 20) { state.servings[r.id]++; renderModal(); }
  };
  document.getElementById("cart-toggle").onclick = () => {
    if (state.cart.has(r.id)) state.cart.delete(r.id);
    else state.cart.add(r.id);
    updateCartFab();
    renderModal();
  };
  document.getElementById("shop-now").onclick = () => {
    if (!state.cart.has(r.id)) state.cart.add(r.id);
    updateCartFab();
    openShoppingList();
  };
}

/* ============================================================
 *  SHOPPING LIST RENDERING
 * ============================================================ */
function updateCartFab() {
  const fab = document.getElementById("cart-fab");
  const count = document.getElementById("cart-count");
  count.textContent = state.cart.size;
  if (state.cart.size > 0) fab.classList.add("visible");
  else fab.classList.remove("visible");
}

function openShoppingList() {
  state.shopOpen = true;
  renderShoppingList();
  document.getElementById("shop-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeShoppingList() {
  state.shopOpen = false;
  document.getElementById("shop-backdrop").classList.remove("open");
  if (!state.openRecipe) document.body.style.overflow = "";
}

function buildShoppingList() {
  // Combine ingredients from all recipes in cart, scaled to current servings.
  // Merge identical names; keep units separate if mismatched.
  const lines = []; // { name, amount, unit, fromRecipes: [] }
  const byKey = new Map();

  state.cart.forEach(rid => {
    const r = RECIPES.find(x => x.id === rid);
    if (!r) return;
    const servings = state.servings[rid] || r.baseServings;
    const factor = servings / r.baseServings;
    r.sections.forEach(sec => {
      sec.ingredients.forEach(ing => {
        const key = ing.name.toLowerCase().trim() + "|" + (ing.unit || "");
        const scaled = ing.amount * factor;
        if (byKey.has(key)) {
          const row = byKey.get(key);
          row.amount += scaled;
          if (!row.fromRecipes.includes(r.title)) row.fromRecipes.push(r.title);
        } else {
          byKey.set(key, {
            name: ing.name,
            amount: scaled,
            unit: ing.unit,
            note: ing.note,
            fromRecipes: [r.title],
            category: categoryFor(ing.name),
          });
        }
      });
    });
  });

  return Array.from(byKey.values());
}

function renderShoppingList() {
  const items = buildShoppingList();
  const recipes = Array.from(state.cart).map(id => RECIPES.find(r => r.id === id)).filter(Boolean);

  // Group by category, preserving canonical order
  const grouped = {};
  const catOrder = [...SHOPPING_CATEGORIES.map(c => c.name), CATEGORY_OTHER];
  catOrder.forEach(c => grouped[c] = []);
  items.forEach(it => grouped[it.category].push(it));

  // Sort items within each category alphabetically
  Object.values(grouped).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name)));

  const categoriesHtml = catOrder
    .filter(c => grouped[c].length > 0)
    .map(c => `
      <div class="shopping-category">
        <h4>${c}</h4>
        ${grouped[c].map((it, i) => `
          <div class="shopping-item">
            <label>
              <input type="checkbox" data-key="${c}-${i}">
              <span class="s-name">${it.name}${it.note ? ` <em style="color:var(--muted); font-size:0.9em;">(${it.note})</em>` : ""}</span>
            </label>
            <span class="s-amount">${formatAmount(it.amount, it.unit)}</span>
          </div>
        `).join("")}
      </div>
    `).join("");

  // Plain-text version for copy/export
  const plainText = catOrder
    .filter(c => grouped[c].length > 0)
    .map(c => `${c.toUpperCase()}\n${grouped[c].map(it => `  • ${it.name} — ${formatAmount(it.amount, it.unit)}${it.note ? ` (${it.note})` : ""}`).join("\n")}`)
    .join("\n\n");

  document.getElementById("shop-content").innerHTML = `
    <div class="shopping-list">
      <h3>Shopping List</h3>
      <div class="from-recipes">${recipes.length === 0 ? "No recipes selected yet." : "From " + recipes.map(r => `<em>${r.title}</em>`).join(", ")}</div>

      ${items.length === 0 ? "" : `
        <div class="shopping-toolbar">
          <button class="action-btn" id="shop-copy">Copy as text</button>
          <button class="action-btn" id="shop-print">Print</button>
          <button class="action-btn" id="shop-clear">Clear list</button>
        </div>
        ${categoriesHtml}
      `}
    </div>
  `;

  if (items.length > 0) {
    document.getElementById("shop-copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        const btn = document.getElementById("shop-copy");
        const prev = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(() => { btn.textContent = prev; }, 1500);
      } catch (e) {
        // Fallback
        const ta = document.createElement("textarea");
        ta.value = plainText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    };
    document.getElementById("shop-print").onclick = () => {
      const w = window.open("", "_blank");
      w.document.write(`<pre style="font-family: Georgia, serif; font-size: 14px; padding: 40px;">Shopping List\nFrom: ${recipes.map(r => r.title).join(", ")}\n\n${plainText}</pre>`);
      w.document.close();
      w.print();
    };
    document.getElementById("shop-clear").onclick = () => {
      state.cart.clear();
      updateCartFab();
      renderShoppingList();
      if (state.openRecipe) renderModal();
    };
  }
}

/* ============================================================
 *  MAIN RENDER
 * ============================================================ */
function render() { renderTagRail(); renderGrid(); }

/* ============================================================
 *  EVENTS
 * ============================================================ */
document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  render();
});

// Search mode toggle
document.getElementById("mode-recipe").addEventListener("click", () => {
  state.searchMode = "recipe";
  document.getElementById("mode-recipe").classList.add("active");
  document.getElementById("mode-ingredient").classList.remove("active");
  document.getElementById("search").placeholder = "Search recipes…";
  render();
});
document.getElementById("mode-ingredient").addEventListener("click", () => {
  state.searchMode = "ingredient";
  document.getElementById("mode-ingredient").classList.add("active");
  document.getElementById("mode-recipe").classList.remove("active");
  document.getElementById("search").placeholder = "Search by ingredient (e.g. tofu, lime, chicken)…";
  render();
});

// Recipe modal close
document.getElementById("close-btn").addEventListener("click", closeRecipe);
document.getElementById("modal-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "modal-backdrop") closeRecipe();
});

// Shopping list modal
document.getElementById("cart-fab").addEventListener("click", openShoppingList);
document.getElementById("shop-close").addEventListener("click", closeShoppingList);
document.getElementById("shop-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "shop-backdrop") closeShoppingList();
});

// Escape closes whichever modal is top-most
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.shopOpen) closeShoppingList();
    else if (state.openRecipe) closeRecipe();
  }
});

render();
updateCartFab();
</script>
