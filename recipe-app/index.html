<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Recipe Compendium · Beans</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f5ede0;
    --paper-warm: #fbf5ec;
    --ink: #2d1f14;
    --ink-soft: #5c4633;
    --muted: #8b7355;
    --accent: #a0522d;
    --accent-dark: #6b2e1a;
    --rule: #c9a96e;
    --rule-soft: #e4d4b1;
    --shadow: 0 1px 2px rgba(45,31,20,0.06), 0 4px 12px rgba(45,31,20,0.04);
    --shadow-lift: 0 4px 8px rgba(45,31,20,0.08), 0 16px 32px rgba(45,31,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201,169,110,0.04) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(160,82,45,0.03) 0, transparent 50%);
  }

  /* ─── Back nav ─── */
  .back-nav {
    padding: 14px 32px;
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(245,237,224,0.95);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover { color: var(--accent); }
  .back-sep { color: var(--rule); font-size: 11px; }
  .back-current {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent-dark);
    text-transform: uppercase;
  }

  .app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }

  /* ─── Masthead ─── */
  .masthead {
    text-align: center;
    padding: 24px 0 48px;
    border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 48px;
  }
  .masthead .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .masthead h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(56px, 9vw, 108px);
    font-weight: 400;
    font-style: italic;
    line-height: 0.95;
    color: var(--accent-dark);
    letter-spacing: -0.02em;
  }
  .masthead .subtitle {
    font-size: 18px;
    font-style: italic;
    color: var(--muted);
    margin-top: 16px;
    letter-spacing: 0.02em;
  }
  .masthead .ornament {
    color: var(--rule);
    font-size: 20px;
    margin: 16px 0;
    letter-spacing: 0.5em;
  }

  /* ─── Controls ─── */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }
  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    position: relative;
    min-width: 200px;
  }
  .search input {
    width: 100%;
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 2px;
    padding: 14px 16px 14px 44px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(160,82,45,0.1);
  }
  .search input::placeholder { color: var(--muted); font-style: italic; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .tag-rail { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 8px;
  }
  .tag {
    background: transparent;
    border: 1px solid var(--rule-soft);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.01em;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.active { background: var(--accent-dark); border-color: var(--accent-dark); color: var(--paper-warm); }
  .tag .count { opacity: 0.6; font-size: 12px; margin-left: 4px; }
  .clear-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    text-decoration: underline;
    text-decoration-color: var(--rule-soft);
    text-underline-offset: 3px;
  }
  .clear-btn:hover { color: var(--accent); }
  .search-mode {
    display: flex;
    gap: 4px;
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .search-mode button {
    background: transparent;
    border: none;
    padding: 8px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.18s;
  }
  .search-mode button.active { background: var(--accent-dark); color: var(--paper-warm); }

  /* ─── Recipe grid ─── */
  .count-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px;
  }
  .card {
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--rule));
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--rule); }
  .card:hover::before { opacity: 1; }

  /* Card photo thumbnail */
  .card-photo {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--rule-soft);
  }
  .card-photo-placeholder {
    width: 100%;
    height: 140px;
    background: linear-gradient(135deg, var(--rule-soft) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .card:hover .card-photo-placeholder { opacity: 0.7; }

  .card-body { padding: 32px 28px 28px; }
  .card .number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .card h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--accent-dark);
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .card .card-subtitle {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    margin-bottom: 20px;
  }
  .card .card-meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
    padding-top: 16px;
    border-top: 1px solid var(--rule-soft);
    margin-bottom: 16px;
  }
  .card .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card-tag {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: var(--accent);
    background: rgba(160,82,45,0.08);
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .card-tag.heritage {
    background: rgba(201,169,110,0.22);
    color: var(--accent-dark);
    font-style: italic;
  }
  .card-tag.heritage::before { content: "✦ "; font-style: normal; }
  .card-nutrition {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--rule-soft);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
  }
  .card-nutrition span strong {
    color: var(--accent-dark);
    font-weight: 500;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
  }
  .matched-ingredient {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent-dark);
    background: rgba(201,169,110,0.25);
    padding: 2px 8px;
    border-radius: 2px;
    margin-top: 12px;
    letter-spacing: 0.02em;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-style: italic;
    font-size: 18px;
  }

  /* ─── Modal ─── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(45,31,20,0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    animation: fadeIn 0.22s ease;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--paper);
    max-width: 820px;
    width: 100%;
    border-radius: 3px;
    box-shadow: 0 30px 80px rgba(45,31,20,0.3);
    padding: 56px 64px 64px;
    position: relative;
    animation: slideUp 0.3s ease;
    overflow: hidden;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.18s;
    z-index: 5;
  }
  .close-btn:hover { background: var(--rule-soft); color: var(--accent-dark); }

  /* ─── Recipe photo hero ─── */
  .recipe-photo-hero {
    width: calc(100% + 128px);
    margin: -56px -64px 40px;
    position: relative;
    overflow: hidden;
  }
  .recipe-photo-hero img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    display: block;
  }
  .recipe-photo-hero .photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(45,31,20,0.35) 100%);
  }
  .recipe-photo-controls {
    position: absolute;
    bottom: 14px;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  .photo-action-btn {
    background: rgba(245,237,224,0.92);
    border: 1px solid var(--rule-soft);
    color: var(--accent-dark);
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.18s;
    backdrop-filter: blur(4px);
  }
  .photo-action-btn:hover { background: var(--accent-dark); color: var(--paper-warm); border-color: var(--accent-dark); }
  .photo-action-btn.danger:hover { background: #7a1f1f; border-color: #7a1f1f; color: var(--paper-warm); }

  /* Empty photo zone */
  .recipe-photo-empty {
    width: calc(100% + 128px);
    margin: -56px -64px 40px;
    height: 200px;
    background: linear-gradient(135deg, var(--rule-soft) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .recipe-photo-empty:hover { background: linear-gradient(135deg, #ddc88a 0%, var(--paper-warm) 100%); }
  .recipe-photo-empty .upload-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .recipe-photo-empty svg { color: var(--rule); opacity: 0.6; }
  .upload-input { display: none; }

  .recipe-header { text-align: center; margin-bottom: 40px; }
  .recipe-header .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .recipe-header h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(40px, 6vw, 56px);
    font-weight: 400;
    color: var(--accent-dark);
    line-height: 1.05;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .recipe-header .italic-sub { font-style: italic; font-size: 20px; color: var(--accent); margin-bottom: 24px; }
  .recipe-header .ornament { color: var(--rule); letter-spacing: 0.4em; margin: 8px 0; }
  .recipe-header .description {
    font-style: italic;
    color: var(--ink-soft);
    max-width: 560px;
    margin: 24px auto 0;
    font-size: 17px;
  }
  .recipe-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 20px; }

  /* Serving scaler */
  .scaler {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 32px 0;
    padding: 24px;
    background: var(--paper-warm);
    border-top: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
  }
  .scaler .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .scaler-controls { display: flex; align-items: center; gap: 14px; }
  .scaler button {
    width: 36px;
    height: 36px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--accent-dark);
    font-size: 20px;
    font-family: 'Cormorant Garamond', serif;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .scaler button:hover:not(:disabled) { background: var(--accent-dark); color: var(--paper-warm); border-color: var(--accent-dark); }
  .scaler button:disabled { opacity: 0.3; cursor: not-allowed; }
  .servings-value {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    color: var(--accent-dark);
    min-width: 70px;
    text-align: center;
    line-height: 1;
  }
  .servings-value .people { font-size: 14px; color: var(--muted); font-style: italic; display: block; margin-top: 4px; }

  .section-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 36px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .ingredient-list { list-style: none; }
  .ingredient-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    gap: 12px;
    border-bottom: 1px dotted var(--rule-soft);
  }
  .ingredient-list li:last-child { border-bottom: none; }
  .ingredient-list .i-name { font-size: 17px; color: var(--ink); }
  .ingredient-list .i-amount { font-style: italic; color: var(--accent-dark); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    counter-increment: step;
    position: relative;
    padding: 16px 0 16px 52px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .steps-list li:last-child { border-bottom: none; }
  .steps-list li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 16px;
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    color: var(--accent);
    font-style: italic;
    line-height: 1;
  }
  .step-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .step-content { font-size: 17px; line-height: 1.6; }
  .step-content .inline-amount {
    font-style: italic;
    color: var(--accent-dark);
    font-weight: 500;
    background: rgba(201,169,110,0.15);
    padding: 0 4px;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }
  .notes {
    margin-top: 36px;
    padding: 24px 28px;
    background: var(--paper-warm);
    border-left: 3px solid var(--rule);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.65;
  }
  .notes-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    font-style: normal;
    margin-bottom: 10px;
    display: block;
  }

  /* Nutrition */
  .nutrition {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: var(--rule-soft);
    border-radius: 3px;
    overflow: hidden;
    margin: 24px 0 8px;
  }
  .nutrition .nut-cell { background: var(--paper-warm); padding: 14px 8px; text-align: center; }
  .nutrition .nut-value {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--accent-dark);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .nutrition .nut-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .nutrition-footnote { font-size: 13px; color: var(--muted); font-style: italic; text-align: center; margin-bottom: 16px; }

  /* Action buttons */
  .recipe-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 24px 0 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    color: var(--accent-dark);
    padding: 10px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.18s;
  }
  .action-btn:hover { background: var(--accent-dark); color: var(--paper-warm); border-color: var(--accent-dark); }
  .action-btn.added { background: var(--accent); color: var(--paper-warm); border-color: var(--accent); }

  /* Cart FAB */
  .cart-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-dark);
    color: var(--paper-warm);
    border: none;
    box-shadow: 0 8px 24px rgba(45,31,20,0.3);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: transform 0.2s;
  }
  .cart-fab.visible { display: flex; }
  .cart-fab:hover { transform: scale(1.08); }
  .cart-fab .count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--rule);
    color: var(--ink);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;

  { p: /\blime\b|\blemons?\b/i,        d: { kcal:30,  fat:0.2, carbs:11,  sugar:1.7, protein:0.7 } },
  { p: /warm water|\bwater\b/i,        d: { kcal:0,   fat:0,   carbs:0,   sugar:0,   protein:0 } },

const UNIT_WEIGHTS = {
  "large onion": 150, "small shallot": 30, "garlic clove": 5,
  "lemongrass stalk": 15, "lime": 65, "lemon": 60, "avocado": 170,
  "chili": 5, "corn tortilla": 25, "bell pepper": 150, "default": 50,
};

function unitWeightFor(name) {
  const n = name.toLowerCase();
  for (const key of Object.keys(UNIT_WEIGHTS)) {
    if (key !== "default" && n.includes(key)) return UNIT_WEIGHTS[key];
  }
  if (n.includes("onion")) return 150;
  if (n.includes("shallot")) return 30;
  if (n.includes("clove")) return 5;
  if (n.includes("tortilla")) return 25;
  if (n.includes("stalk")) return 15;
  if (n.includes("pepper")) return 150;
  return UNIT_WEIGHTS.default;
}

function nutritionFor(ingredient) {
  const hit = NUTRITION_DB.find(e => e.p.test(ingredient.name));
  if (!hit) return { kcal:0, fat:0, carbs:0, sugar:0, protein:0 };
  let grams = (ingredient.unit === "g" || ingredient.unit === "ml")
    ? ingredient.amount
    : ingredient.amount * unitWeightFor(ingredient.name);
  let factor = 1;
  const n = ingredient.name.toLowerCase();
  if (/for frying|frying tortillas/.test(n)) factor = 0.12;
  else if (/rum|gin|vodka|alcohol/.test(n)) factor = 0.15;
  else if (/ground pork|pork\b/.test(n)) {
    const f = grams / 100;
    return { kcal: hit.d.kcal*f*0.85, fat: hit.d.fat*f*0.70, carbs: hit.d.carbs*f, sugar: hit.d.sugar*f, protein: hit.d.protein*f };
  }
  const f = (grams / 100) * factor;
  return { kcal: hit.d.kcal*f, fat: hit.d.fat*f, carbs: hit.d.carbs*f, sugar: hit.d.sugar*f, protein: hit.d.protein*f };
}

function recipeNutritionPerServing(recipe) {
  const totals = { kcal:0, fat:0, carbs:0, sugar:0, protein:0 };
  recipe.sections.forEach(sec => sec.ingredients.forEach(ing => {
    const n = nutritionFor(ing);
    Object.keys(totals).forEach(k => totals[k] += n[k]);
  }));
  const s = recipe.baseServings;
  return { kcal: Math.round(totals.kcal/s), fat: Math.round(totals.fat/s), carbs: Math.round(totals.carbs/s), sugar: Math.round(totals.sugar/s), protein: Math.round(totals.protein/s) };
}

const PHOTO_KEY_PREFIX = 'beans_recipe_photo_';

function photoKey(recipeId) { return PHOTO_KEY_PREFIX + recipeId; }

function getPhoto(recipeId) {
  try { return localStorage.getItem(photoKey(recipeId)) || null; }
  catch (e) { return null; }
}

function savePhoto(recipeId, dataUrl) {
  try { localStorage.setItem(photoKey(recipeId), dataUrl); return true; }
  catch (e) {
    // localStorage full — likely too many/large photos
    alert('Could not save photo — your browser storage may be full. Try removing another photo first.');
    return false;
  }
}

function deletePhoto(recipeId) {
  try { localStorage.removeItem(photoKey(recipeId)); } catch (e) {}
}

/* Compress an image File to a JPEG data URL at max 800px wide */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 900;
      let { width, height } = img;
      if (width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ============================================================
 *  INGREDIENT SCALING
 * ============================================================ */
function formatAmount(amount, unit) {
  let display;
  if (!unit || unit === "cloves" || unit === "stalks") {
    const rounded = Math.round(amount * 2) / 2;
    display = rounded % 1 === 0 ? rounded.toString() : rounded.toFixed(1);
    if (unit && Number(display) === 1) unit = unit === "cloves" ? "clove" : unit === "stalks" ? "stalk" : unit;
  } else if (unit === "g" || unit === "ml") {
    if (amount < 10) display = amount.toFixed(1).replace(/\.0$/, "");
    else if (amount < 100) display = Math.round(amount).toString();
    else display = (Math.round(amount / 5) * 5).toString();
  } else {
    display = Math.round(amount).toString();
  }
  return unit ? `${display} ${unit}` : display;
}

function scaleIngredient(ing, servings, base) {
  return formatAmount(ing.amount * (servings / base), ing.unit);
}

/* ============================================================
 *  RENDERING — tag rail
 * ============================================================ */
function renderTagRail() {
  const rail = document.getElementById("tag-rail");
  rail.innerHTML = '<span class="tag-label">Filter</span>';
  ALL_TAGS.forEach(tag => {
    const count = RECIPES.filter(r => r.tags.includes(tag)).length;
    if (count === 0) return;
    const btn = document.createElement("button");
    btn.className = "tag" + (state.activeTags.has(tag) ? " active" : "");
    btn.innerHTML = `${tag}<span class="count">·${count}</span>`;
    btn.onclick = () => {
      state.activeTags.has(tag) ? state.activeTags.delete(tag) : state.activeTags.add(tag);
      render();
    };
    rail.appendChild(btn);
  });
  if (state.activeTags.size > 0 || state.search) {
    const clear = document.createElement("button");
    clear.className = "clear-btn";
    clear.textContent = "clear all";
    clear.onclick = () => {
      state.activeTags.clear();
      state.search = "";
      document.getElementById("search").value = "";
      render();
    };
    rail.appendChild(clear);
  }
}

/* ============================================================
 *  RENDERING — recipe grid
 * ============================================================ */
function matchesFilters(recipe) {
  if (state.activeTags.size > 0) {
    for (const t of state.activeTags) if (!recipe.tags.includes(t)) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    if (state.searchMode === "ingredient") {
      let hit = null;
      for (const sec of recipe.sections) {
        for (const ing of sec.ingredients) {
          if (ing.name.toLowerCase().includes(q)) { hit = ing.name; break; }
        }
        if (hit) break;
      }
      if (!hit) return false;
      recipe._matchedIngredient = hit;
    } else {
      const hay = (recipe.title + " " + recipe.subtitle + " " + recipe.description + " " + recipe.tags.join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
      recipe._matchedIngredient = null;
    }
  } else {
    recipe._matchedIngredient = null;
  }
  return true;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const countLabel = document.getElementById("count-label");
  const filtered = RECIPES.filter(matchesFilters);
  countLabel.textContent = filtered.length === RECIPES.length
    ? `${RECIPES.length} recipe${RECIPES.length === 1 ? "" : "s"}`
    : `${filtered.length} of ${RECIPES.length} recipes`;

  grid.innerHTML = "";
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No recipes match these filters.</div>';
    return;
  }
  filtered.forEach(r => {
    const card = document.createElement("article");
    card.className = "card";
    card.onclick = () => openRecipe(r.id);
    const nut = recipeNutritionPerServing(r);
    const photo = getPhoto(r.id);

    let photoHtml = photo
      ? `<img class="card-photo" src="${photo}" alt="${r.title}" loading="lazy" />`
      : `<div class="card-photo-placeholder">Add a photo</div>`;

    card.innerHTML = `
      ${photoHtml}
      <div class="card-body">
        <div class="number">Recipe · ${r.number}</div>
        <h3>${r.title}</h3>
        <div class="card-subtitle">${r.subtitle}</div>
        <div class="card-meta">
          <span>◷ ${r.meta.prep}</span>
          <span>♨ ${r.meta.cook}</span>
          <span>☺ ${r.baseServings}</span>
        </div>
        <div class="card-tags">${r.tags.map(t => `<span class="card-tag${t === 'heritage' ? ' heritage' : ''}">${t}</span>`).join("")}</div>
        <div class="card-nutrition">
          <span><strong>${nut.kcal}</strong> kcal</span>
          <span><strong>${nut.protein}</strong>g protein</span>
          <span><strong>${nut.carbs}</strong>g carbs</span>
          <span><strong>${nut.fat}</strong>g fat</span>
        </div>
        ${r._matchedIngredient ? `<div class="matched-ingredient">✓ ${r._matchedIngredient}</div>` : ""}

    grid.appendChild(card);

    return `<span class="inline-amount">${scaleIngredient(ing, servings, baseServings)} ${ing.name}</span>`;

/* ============================================================
 *  PHOTO UPLOAD
 * ============================================================ */
function triggerUpload(recipeId) {
  state.pendingUploadFor = recipeId;
  const input = document.getElementById("photo-upload-input");
  input.value = ""; // reset so same file can be re-selected
  input.click();
}

document.getElementById("photo-upload-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file || !state.pendingUploadFor) return;

  // Show a brief loading state by disabling the zone
  const zone = document.getElementById("add-photo-zone") || document.getElementById("change-photo-btn");
  if (zone) zone.style.opacity = "0.5";

  try {
    const dataUrl = await compressImage(file);
    const saved = savePhoto(state.pendingUploadFor, dataUrl);
    if (saved) {
      renderModal();
      renderGrid();
    }
  } catch (err) {
    alert("Couldn't load that image. Please try a different file.");
  }
  state.pendingUploadFor = null;
});

function updateCartFab() {
  const fab = document.getElementById("cart-fab");
  document.getElementById("cart-count").textContent = state.cart.size;
  state.cart.size > 0 ? fab.classList.add("visible") : fab.classList.remove("visible");

function openShoppingList() {
  state.shopOpen = true;
  renderShoppingList();
  document.getElementById("shop-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeShoppingList() {
  state.shopOpen = false;
  document.getElementById("shop-backdrop").classList.remove("open");
  if (!state.openRecipe) document.body.style.overflow = "";
}

function buildShoppingList() {
  const byKey = new Map();
  state.cart.forEach(rid => {
    const r = RECIPES.find(x => x.id === rid);
    if (!r) return;
    const factor = (state.servings[rid] || r.baseServings) / r.baseServings;
    r.sections.forEach(sec => sec.ingredients.forEach(ing => {
      const key = ing.name.toLowerCase().trim() + "|" + (ing.unit || "");
      const scaled = ing.amount * factor;
      if (byKey.has(key)) {
        const row = byKey.get(key);
        row.amount += scaled;
        if (!row.fromRecipes.includes(r.title)) row.fromRecipes.push(r.title);
      } else {
        byKey.set(key, { name: ing.name, amount: scaled, unit: ing.unit, note: ing.note, fromRecipes: [r.title], category: categoryFor(ing.name) });
      }
    }));
  });
  return Array.from(byKey.values());
}

function renderShoppingList() {
  const items = buildShoppingList();
  const recipes = Array.from(state.cart).map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
  const catOrder = [...SHOPPING_CATEGORIES.map(c => c.name), CATEGORY_OTHER];
  const grouped = {};
  catOrder.forEach(c => grouped[c] = []);
  items.forEach(it => grouped[it.category].push(it));
  Object.values(grouped).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name)));

  const categoriesHtml = catOrder
    .filter(c => grouped[c].length > 0)
    .map(c => `
      <div class="shopping-category">
        <h4>${c}</h4>
        ${grouped[c].map((it, i) => `

              <span class="s-name">${it.name}${it.note ? ` <em style="color:var(--muted); font-size:0.9em;">(${it.note})</em>` : ""}</span>
            </label>
            <span class="s-amount">${formatAmount(it.amount, it.unit)}</span>
          </div>
        `).join("")}
      </div>
    `).join("");

  const plainText = catOrder
    .filter(c => grouped[c].length > 0)
    .map(c => `${c.toUpperCase()}\n${grouped[c].map(it => `  • ${it.name} — ${formatAmount(it.amount, it.unit)}${it.note ? ` (${it.note})` : ""}`).join("\n")}`)
    .join("\n\n");

  document.getElementById("shop-content").innerHTML = `
    <div class="shopping-list">
      <h3>Shopping List</h3>
      <div class="from-recipes">${recipes.length === 0 ? "No recipes selected yet." : "From " + recipes.map(r => `<em>${r.title}</em>`).join(", ")}</div>
      ${items.length === 0 ? "" : `
        <div class="shopping-toolbar">
          <button class="action-btn" id="shop-copy">Copy as text</button>
          <button class="action-btn" id="shop-print">Print</button>
          <button class="action-btn" id="shop-clear">Clear list</button>
        </div>
        ${categoriesHtml}
      `}
    </div>
  `;

  if (items.length > 0) {
    document.getElementById("shop-copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        const btn = document.getElementById("shop-copy");
        const prev = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(() => { btn.textContent = prev; }, 1500);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = plainText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    };
    document.getElementById("shop-print").onclick = () => {
      const w = window.open("", "_blank");
      w.document.write(`<pre style="font-family: Georgia, serif; font-size: 14px; padding: 40px;">Shopping List\nFrom: ${recipes.map(r => r.title).join(", ")}\n\n${plainText}</pre>`);
      w.document.close();
      w.print();
    };
    document.getElementById("shop-clear").onclick = () => {
      state.cart.clear();
      updateCartFab();
      renderShoppingList();
      if (state.openRecipe) renderModal();
    };
  }
}

/* ============================================================
 *  MAIN
 * ============================================================ */
function render() { renderTagRail(); renderGrid(); }

document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
document.getElementById("mode-recipe").addEventListener("click", () => {
  state.searchMode = "recipe";
  document.getElementById("mode-recipe").classList.add("active");
  document.getElementById("mode-ingredient").classList.remove("active");
  document.getElementById("search").placeholder = "Search recipes…";
  render();
});
document.getElementById("mode-ingredient").addEventListener("click", () => {
  state.searchMode = "ingredient";
  document.getElementById("mode-ingredient").classList.add("active");
  document.getElementById("mode-recipe").classList.remove("active");
  document.getElementById("search").placeholder = "Search by ingredient (e.g. tofu, lime, chicken)…";
  render();
});
document.getElementById("close-btn").addEventListener("click", closeRecipe);
document.getElementById("modal-backdrop").addEventListener("click", e => { if (e.target.id === "modal-backdrop") closeRecipe(); });
document.getElementById("cart-fab").addEventListener("click", openShoppingList);
document.getElementById("shop-close").addEventListener("click", closeShoppingList);
document.getElementById("shop-backdrop").addEventListener("click", e => { if (e.target.id === "shop-backdrop") closeShoppingList(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (state.shopOpen) closeShoppingList(); else if (state.openRecipe) closeRecipe(); }
});

render();
updateCartFab();
</script>
</body>
</html>
